html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(28px,7vw,40px);font-weight:900;line-height:1.25;margin:24px 0 12px;letter-spacing:.01em}
.lead{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cnt{font-size:13px;color:var(--sub);margin-bottom:14px}
h2{font-size:22px;line-height:1.4;margin:0 0 6px}
.hint{font-size:14px;color:var(--sub);margin:0 0 16px}
.opts{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:500;min-height:52px}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accsoft);border-color:var(--acc)}
.opt small{display:block;color:var(--sub);font-weight:400;font-size:13px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px}
.ghost{background:none;border:0;color:var(--sub);padding:10px 4px;text-decoration:underline}
:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.res{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px 18px;margin-bottom:14px}
.res.first{border:2px solid var(--acc)}
.rk{font-size:13px;color:var(--sub);font-weight:700}
.res h3{margin:2px 0 4px;font-size:24px}
.tag{color:var(--acc);font-weight:700;margin:0 0 10px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:var(--bar)}
.res ul{margin:6px 0 10px;padding-left:20px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.charttitle{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
.meterrow{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.meterrow .meter{flex:1;margin:0}
.meterpct{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:700}
.whytitle{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px}
.plan{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--accsoft);border-radius:10px;padding:10px 12px;margin:10px 0}
.planname{font-size:14px;font-weight:700}
.planprice{font-size:14px;font-weight:700;color:var(--acc);white-space:nowrap}
.warn{font-size:14px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;margin:0}
.note{font-size:13px;color:var(--sub);margin-top:20px}
.also{font-size:15px;color:var(--sub)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

{t:"J:COM・eo光・BIGLOBE光など",l:"ネット回線とのセット割が使える",s:{jcom:3,mineo:2,biglobe:3}},
{t:"特にない",l:"",s:{iij:1,nihon:1,his:1,nuro:1}}]},
{q:"重視するのはどれ？",h:"",o:[
{t:"とにかく安く",l:"料金を最優先したい",s:{nihon:3,iij:3,his:3,linemo:2,povo:2,nuro:2}},
{t:"つながりやすさ・通信品質",l:"通信品質を重視したい",s:{docomo:3,au:3,sb:3,ahamo:2,uq:1,ymobile:1}},
{t:"料金と品質のバランス",l:"料金と品質のバランスを重視",s:{ahamo:3,uq:2,ymobile:2,linemo:2,povo:1,rakuten:1}}]},
{q:"誰が使う？",h:"",o:[
{t:"自分（大人）",l:"",s:{}},
{t:"子ども",l:"子どもが使う（見守り・制限が必要）",s:{tone:3,docomo:1,au:1,sb:1,uq:1,ymobile:1}},
{t:"高齢の家族",l:"高齢者向けのサポートが必要",s:{docomo:3,au:2,sb:2,ymobile:2,aeon:2,jcom:2,tone:2}}]},
{q:"スマホ本体はどうする？",h:"",o:[
{t:"今の端末を使う／自分で用意する",l:"端末は自分で用意できる",s:{ahamo:1,povo:1,linemo:1,nihon:1,his:1,nuro:1}},
{t:"契約と一緒に買いたい・下取りしたい",l:"端末購入や下取りを頼みたい",s:{docomo:3,au:3,sb:3,ymobile:2,uq:2,iij:1,rakuten:1}}]}
];
let step=0,ans=[],curCarrier="none",curPrice=null;
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function start(){step=0;ans=[];curCarrier="none";curPrice=null;
app.innerHTML=`<h1>あなたに合う<br>スマホ会社とプランを探す</h1><p class="lead">${Q.length}つの質問に答えるだけ。約1〜2分で、相性のよい会社を上位3社まで絞り込み、具体的なプラン名と月額料金の目安まで提示します。今の契約も入力すると、乗り換え先の候補と料金差まで提示します。</p><button class="btn" id="go">質問をはじめる</button>`;
document.getElementById("go").onclick=showCurrent}
function showCurrent(){
const carrierBtns=Object.keys(C).map(k=>`<button class="opt${curCarrier===k?" sel":""}" data-k="${k}">${EMOJI[k]||""} ${C[k].n}</button>`).join("")
+`<button class="opt${curCarrier==="other"?" sel":""}" data-k="other">その他の格安SIM・未掲載の会社</button>`
+`<button class="opt${curCarrier==="none"?" sel":""}" data-k="none">今は契約していない／わからない</button>`;
app.innerHTML=`<div class="card"><h2>今、契約中の会社は？</h2><p class="hint">入力すると、乗り換えた場合の料金差まで提示します（未入力でも診断は進められます）。</p><div class="opts" id="curOpts">${carrierBtns}</div><label style="display:block;margin-top:18px;font-weight:700;font-size:14px">今の月額料金（概算・円、任意）</label><input type="number" inputmode="numeric" id="curPriceInput" placeholder="例: 6000" value="${curPrice===null?"":curPrice}" style="width:100%;margin-top:6px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)"><div class="row"><button class="btn" id="curNext">次へ</button></div></div>`;
app.querySelectorAll("#curOpts .opt").forEach(b=>b.onclick=()=>{curCarrier=b.dataset.k;app.querySelectorAll("#curOpts .opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
document.getElementById("curNext").onclick=()=>{const v=document.getElementById("curPriceInput").value;curPrice=v?Math.max(0,parseInt(v,10)||0):null;render()};
window.scrollTo(0,0)}
function render(){
if(step>=Q.length)return result();
const d=Q[step];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${step/Q.length*100}%"></i></div><div class="cnt">${step+1} / ${Q.length}</div><h2>${esc(d.q)}</h2>${d.h?`<p class="hint">${esc(d.h)}</p>`:""}<div class="opts">${d.o.map((o,i)=>`<button class="opt${ans[step]===i?" sel":""}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div><div class="row"><button class="ghost" id="bk">前の質問に戻る</button></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[step]=+b.dataset.i;step++;render()});
document.getElementById("bk").onclick=()=>{if(step===0){showCurrent()}else{step--;render()}};
window.scrollTo(0,0)}
function result(){
const sc={},why={};
Object.keys(C).forEach(k=>{sc[k]=0;why[k]=[]});
let excluded=[];
ans.forEach((a,i)=>{const o=Q[i].o[a];
if(o.must&&o.must.exclude){o.must.exclude.forEach(k=>{if(C[k]&&!excluded.includes(k))excluded.push(k)})}
for(const k in o.s){sc[k]+=o.s[k];if(o.l&&o.s[k]>=2)why[k].push(o.l)}});
excluded.forEach(k=>{sc[k]=-Infinity});
let r=Object.keys(C).filter(k=>sc[k]>-Infinity).sort((a,b)=>sc[b]-sc[a]);
if(r.length<3)r=Object.keys(C).sort((a,b)=>sc[b]-sc[a]); // 除外しすぎた場合の安全策
const excludedNote=excluded.length&&r.length>=3?`必須条件（店舗サポート）に合わないため、${excluded.map(k=>C[k].n).join("・")}を候補から除外しました。`:"";
const top=sc[r[0]]||1;
const gb=GB_EST[ans[0]]!==undefined?GB_EST[ans[0]]:20;
const flexNote=ans[0]===4?"月ごとの使用量にムラがあるため、定額よりトッピング/段階制プランが向いています。":"";
const hasCurrent=C[curCarrier]!==undefined; // 現在の契約が実在キャリアとして選択されているか
const switchCandidates=r.filter(k=>k!==curCarrier); // 乗り換え先候補からは今の契約先を除く
const top3=switchCandidates.slice(0,3);
let switchBanner="";
if(curPrice!==null&&curPrice>0&&top3.length){
const bestKey=top3[0];
const bestPrice=pickPlan(bestKey,gb).tier.price;
const diff=curPrice-bestPrice;
if(hasCurrent&&r[0]===curCarrier){
switchBanner=`回答との相性は今の契約先（${C[curCarrier].n}）が最も高い結果でした。乗り換えるより、同じ会社内でのプラン見直しが合っている可能性があります。`;
}else if(diff>=300){
switchBanner=`今の月額（${curPrice.toLocaleString()}円）と比べて、${C[bestKey].n}への乗り換えで月あたり約${diff.toLocaleString()}円（年間約${(diff*12).toLocaleString()}円）安くなる可能性があります。`;
}else if(diff<=-300){
switchBanner=`候補の会社は今の月額（${curPrice.toLocaleString()}円）より高くなる可能性があります。料金より通信品質やサービスの違いを比べる材料としてご覧ください。`;
}else{
switchBanner=`候補の会社の料金は、今の月額（${curPrice.toLocaleString()}円）とほぼ同水準です。`;
}
}else if(hasCurrent&&r[0]===curCarrier){
switchBanner=`回答との相性は今の契約先（${C[curCarrier].n}）が最も高い結果でした。乗り換えるより、同じ会社内でのプラン見直しが合っている可能性があります。`;
}
const card=(k,i)=>{const {tier,insufficient}=pickPlan(k,gb);
const priceLabel=`${tier.price.toLocaleString()}円/月`+(tier.discount?`（${esc(tier.discount)}）`:"");
const capWarn=insufficient?`<p class="warn">＊このキャリアの最大容量プラン（〜${tier.m}GB）でも、希望のデータ量には届かない可能性があります</p>`:"";
const confirmed=UPDATED?`確認日: ${esc(UPDATED)}`:"確認日: 未確認（要公式サイト確認）";
let diffLine="";
if(curPrice!==null&&curPrice>0){
const d=curPrice-tier.price;
if(d>=100)diffLine=`<p class="warn" style="color:var(--acc);font-weight:700">今の料金より月${d.toLocaleString()}円安い見込み（年間約${(d*12).toLocaleString()}円）</p>`;
else if(d<=-100)diffLine=`<p class="warn">今の料金より月${Math.abs(d).toLocaleString()}円高い見込み</p>`;
else diffLine=`<p class="warn">今の料金とほぼ同じ見込み</p>`;
}
return `<section class="res${i?"":" first"}"><div class="rk">${i+1}位</div><h3>${EMOJI[k]||""} ${C[k].n}</h3><p class="tag">${C[k].t}</p><div class="meterrow"><div class="meter" role="img" aria-label="相性度 ${Math.round(sc[k]/top*100)}%"><i style="width:${Math.max(8,sc[k]/top*100)}%"></i></div><span class="meterpct">相性 ${Math.round(sc[k]/top*100)}%</span></div>${why[k].length?`<div class="whytitle">あなたに合う理由</div><ul>${why[k].map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}<div class="plan"><span class="planname">推奨プラン：${esc(tier.pl)}</span><span class="planprice">${esc(priceLabel)}</span></div>${diffLine}${capWarn}<p class="warn">注意点：${esc(C[k].w)}</p><p class="warn">${confirmed} ／ <a href="${esc(C[k].url)}" target="_blank" rel="noopener">公式サイトで料金を確認</a></p></section>`};
const curSummary=`<p class="hint">今の契約：${hasCurrent?EMOJI[curCarrier]+" "+C[curCarrier].n:curCarrier==="other"?"その他の格安SIM":"未入力"}${curPrice!==null?`／月額 約${curPrice.toLocaleString()}円`:""}</p>`;
app.innerHTML=`<h1>あなたに合う候補</h1><p class="lead">回答との相性が高い順に、乗り換え先の候補と具体的なプラン・料金目安を提示します。</p>${curSummary}${switchBanner?`<p class="hint" style="font-weight:700">${esc(switchBanner)}</p>`:""}${excludedNote?`<p class="hint">${esc(excludedNote)}</p>`:""}${flexNote?`<p class="hint">${flexNote}</p>`:""}${priceChart(top3,gb)}${top3.map(card).join("")}<p class="also">次点：${switchCandidates.slice(3,6).map(k=>EMOJI[k]+C[k].n).join("、")}</p><div class="row"><button class="btn" id="re">もう一度診断する</button><button class="ghost" id="ed">回答を修正する</button></div><p class="note">料金は基本プラン料金の目安（税込）です。家族割・光回線セット割・クレジットカード割等の適用有無で実質額は変わります。キャンペーン・エリア・提供条件も変わるため、契約前に各社公式サイトで最新情報と、自宅や職場での電波状況を確認してください。乗り換えの際は違約金・端末残債・MNP転出手数料の有無も必ず確認してください。</p>`;
document.getElementById("re").onclick=start;
document.getElementById("ed").onclick=()=>{step=0;render()};
window.scrollTo(0,0)}
start();
</script>
</body>
</html>
