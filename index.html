<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマホ会社ファインダー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--sub:#5b6785;--line:#d5dce8;--acc:#2f5bff;--accsoft:#e4eaff;--on:#fff;--bar:#ffb703;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1324;--card:#172038;--ink:#eef2fb;--sub:#a3aecb;--line:#2b3654;--acc:#7d9bff;--accsoft:#22305a;--on:#0d1324;--bar:#ffb703}}
:root[data-theme="dark"]{--bg:#0d1324;--card:#172038;--ink:#eef2fb;--sub:#a3aecb;--line:#2b3654;--acc:#7d9bff;--accsoft:#22305a;--on:#0d1324;--bar:#ffb703}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(28px,7vw,40px);font-weight:900;line-height:1.25;margin:24px 0 12px;letter-spacing:.01em}
.lead{color:var(--sub);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cnt{font-size:13px;color:var(--sub);margin-bottom:14px}
h2{font-size:22px;line-height:1.4;margin:0 0 6px}
.hint{font-size:14px;color:var(--sub);margin:0 0 16px}
.opts{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:500;min-height:52px}
.opt:hover{border-color:var(--acc)}
.opt.sel{background:var(--accsoft);border-color:var(--acc)}
.opt small{display:block;color:var(--sub);font-weight:400;font-size:13px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px}
.ghost{background:none;border:0;color:var(--sub);padding:10px 4px;text-decoration:underline}
:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.res{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px 18px;margin-bottom:14px}
.res.first{border:2px solid var(--acc)}
.rk{font-size:13px;color:var(--sub);font-weight:700}
.res h3{margin:2px 0 4px;font-size:24px}
.tag{color:var(--acc);font-weight:700;margin:0 0 10px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;background:var(--bar)}
.res ul{margin:6px 0 10px;padding-left:20px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.charttitle{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
.meterrow{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.meterrow .meter{flex:1;margin:0}
.meterpct{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:700}
.whytitle{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px}
.plan{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--accsoft);border-radius:10px;padding:10px 12px;margin:10px 0}
.planname{font-size:14px;font-weight:700}
.planprice{font-size:14px;font-weight:700;color:var(--acc);white-space:nowrap}
.warn{font-size:14px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;margin:0}
.note{font-size:13px;color:var(--sub);margin-top:20px}
.also{font-size:15px;color:var(--sub)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

<main>

</main>

function pickPlan(k,gb){const tiers=C[k].p;for(const t of tiers){if(gb<=t.m)return t}return tiers[tiers.length-1]}

function parsePrice(s){const m=s.replace(/,/g,"").match(/(\d+)円/);return m?parseInt(m[1],10):0}
function priceChart(order,gb){
const rows=order.map(k=>{const pl=pickPlan(k,gb);return{name:C[k].n,icon:EMOJI[k]||"",val:parsePrice(pl.pr)}});
const max=Math.max(...rows.map(r=>r.val),1);
const bh=24,gap=12,padTop=8,barMaxW=150,leftW=104;
const totalW=leftW+barMaxW+62;
const h=padTop*2+rows.length*(bh+gap)-gap;
const bars=rows.map((r,i)=>{const y=padTop+i*(bh+gap);const w=Math.max(6,r.val/max*barMaxW);
return `<text x="0" y="${y+bh*0.68}" font-size="12" fill="var(--ink)">${esc(r.icon+" "+r.name)}</text><rect x="${leftW}" y="${y}" width="${barMaxW}" height="${bh}" rx="6" fill="var(--line)"></rect><rect x="${leftW}" y="${y}" width="${w}" height="${bh}" rx="6" fill="var(--acc)"></rect><text x="${leftW+barMaxW+8}" y="${y+bh*0.68}" font-size="12" font-weight="700" fill="var(--acc)">${r.val.toLocaleString()}円</text>`}).join("");
return `<div class="chartcard"><div class="charttitle">月額料金比較（推奨プラン基準）</div><svg viewBox="0 0 ${totalW} ${h}" width="100%" role="img" aria-label="月額料金比較チャート">${bars}</svg></div>`}
const Q=[

{t:"3〜10GB",l:"月3〜10GB程度の利用",s:{linemo:3,uq:2,ymobile:2,iij:2,nuro:3,nihon:2,mineo:2,biglobe:2,aeon:2,yu:1}},
{t:"10〜30GB",l:"月10〜30GB程度の利用",s:{ahamo:3,uq:3,ymobile:2,nihon:3,linemo:2,rakuten:2,yu:2,docomo:1,au:1,sb:1}},

{t:"月によって大きく変わる",l:"月ごとに使用量が変わる",s:{povo:3,rakuten:3,mineo:3}}]},

{t:"必要",l:"店舗サポートがある",s:{docomo:3,au:3,sb:3,uq:3,ymobile:3,aeon:3,jcom:2,rakuten:1}},
{t:"どちらでもよい",l:"",s:{}},

let step=0,ans=[];
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function start(){step=0;ans=[];
app.innerHTML=`<h1>あなたに合う<br>スマホ会社とプランを探す</h1><p class="lead">8つの質問に答えるだけ。約1分で、相性のよい会社を上位3社まで絞り込み、具体的なプラン名と月額料金の目安まで提示します。</p><button class="btn" id="go">質問をはじめる</button>`;
document.getElementById("go").onclick=render}
function render(){
if(step>=Q.length)return result();
const d=Q[step];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${step/Q.length*100}%"></i></div><div class="cnt">${step+1} / ${Q.length}</div><h2>${esc(d.q)}</h2>${d.h?`<p class="hint">${esc(d.h)}</p>`:""}<div class="opts">${d.o.map((o,i)=>`<button class="opt${ans[step]===i?" sel":""}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div><div class="row"><button class="ghost${step?"":" hide"}" id="bk">前の質問に戻る</button></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[step]=+b.dataset.i;step++;render()});
const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{step--;render()};
window.scrollTo(0,0)}
function result(){
const sc={},why={};
Object.keys(C).forEach(k=>{sc[k]=0;why[k]=[]});
ans.forEach((a,i)=>{const o=Q[i].o[a];for(const k in o.s){sc[k]+=o.s[k];if(o.l&&o.s[k]>=2)why[k].push(o.l)}});
const r=Object.keys(C).sort((a,b)=>sc[b]-sc[a]);
const top=sc[r[0]]||1;
const gb=GB_EST[ans[0]]!==undefined?GB_EST[ans[0]]:20;
const flexNote=ans[0]===4?"月ごとの使用量にムラがあるため、定額よりトッピング/段階制プランが向いています。":"";
